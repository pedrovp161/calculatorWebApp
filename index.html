<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator App</title>
    <!-- link css -->
    <link rel="stylesheet" href="style.css">
    <!-- link js -->
    <script src="index.js" defer type="module"></script> 
</head>
<body>
    <form id="Calculator">
        <input id="display" type="text" value=0 name="display" min="0" max=1000 readonly>
    
    <div class="buttons">
        <div class="row">

            <button class="number" type="button">C</button>
            <button class="number" type="button">&divide;</button>
            <button class="special" type="button">&larr;</button>

        </div>
        <div class="row">

            <button class="number" type="button">7</button>
            <button class="number" type="button">8</button>
            <button class="number" type="button">9</button>
            <button class="special" type="button">&times;</button>

        </div>

        <div class="row">

            <button class="number" type="button">4</button>
            <button class="number" type="button">5</button>
            <button class="number" type="button">6</button>
            <button class="special" type="button">+</button>

        </div>
        
        <div class="row">

            <button class="number" type="button">1</button>
            <button class="number" type="button">2</button>
            <button class="number" type="button">3</button>
            <button class="special" type="button">-</button>

        </div>

        <div class="row">
            <button class="number" type="button">0</button>
            <button class="number" type="button">00</button>
            <button class="number" type="button">.</button>
            <button class="special" type="button">=</button>
        </div>
    </div>
    </form>
</body>
</html>
